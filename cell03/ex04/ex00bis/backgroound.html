<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="backgroound.css">
<button onclick="document.body.style.backgroundColor = getRandomColor()">Don't click me</button>
<script>
function getRandomColor() {
    const letters = '0123456789ABCDEF';
    let color = '#';
    for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
    }
    return color;
}
</script>
