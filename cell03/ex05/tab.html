<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table with Colored Boxes</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        td {
            width: 50%;
            height: 100px;
            text-align: center;
            vertical-align: middle;
            font-size: 18px;
            font-family: Arial, sans-serif;
            color: white;
        }
        .box1 {
            background-color: #4CAF50; /* Green */
        }
        .box2 {
            background-color: #2196F3; /* Blue */
        }
    </style>
</head>
<body>
    <table border="1">
        <tr>
            <td class="box1">Hello, World!</td>
            <td class="box2">Welcome to HTML!</td>
        </tr>
    </table>
</body>
</html>
