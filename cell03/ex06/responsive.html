<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table with Colored Boxes</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }
        td {
            text-align: center;
            vertical-align: middle;
            font-size: 18px;
            font-family: Arial, sans-serif;
            color: white;
            width: 50%; /* Equal width for both cells */
            height: 50%; /* Equal height for both cells */
        }
        .box1 {
            background-color: #4CAF50; /* Green */
        }
        .box2 {
            background-color: #2196F3; /* Blue */
        }
    </style>
</head>
<body>
    <table border="1">
        <tr>
            <td class="box1">Hello, World!</td>
            <td class="box2">Welcome to HTML!</td>
        </tr>
    </table>
</body>
</html>
